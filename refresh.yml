name: Refresh WatchDrop
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder feed refresh
        run: |
          echo "Connect authorised retailer/affiliate feeds here."
          python - <<'PY'
          import json
          p="data/watches.json"
          data=json.load(open(p))
          json.dump(data,open(p,"w"),indent=2)
          PY
      - name: Commit changes
        run: |
          git config user.name "WatchDrop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/watches.json
          git diff --cached --quiet || git commit -m "Refresh watch data"
          git push
