name: Refresh WatchDrop

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import authorised product feeds
        env:
          AWIN_FEEDS: ${{ secrets.AWIN_FEEDS }}
        run: python scripts/import_feeds.py
      - name: Commit updated watch data
        run: |
          git config user.name "WatchDrop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/watches.json
          git diff --cached --quiet || git commit -m "Refresh watch deals"
          git push
