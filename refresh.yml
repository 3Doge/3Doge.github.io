name: Refresh WatchDrop catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Import authorised feeds
        env:
          AWIN_FEEDS: ${{ secrets.AWIN_FEEDS }}
        run: python scripts/import_feeds.py

      - name: Commit changes
        run: |
          git config user.name "WatchDrop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/watches.json
          git diff --cached --quiet || git commit -m "Refresh watch deals"
          git push
